<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Timmy Pan profile banner</title>
  <desc id="description">A dark blue signal-processing banner with a waveform, a constellation diagram, and Timmy Pan's research themes.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#0b2239" />
      <stop offset="1" stop-color="#0d3a50" />
    </linearGradient>
    <radialGradient id="halo" cx="0.82" cy="0.43" r="0.46">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.19" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="0.2" stop-color="#2dd4bf" />
      <stop offset="0.64" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)" />
  <rect width="1200" height="360" rx="28" fill="url(#halo)" />
  <rect width="1200" height="360" rx="28" fill="url(#grid)" />

  <path
    d="M 0 304 C 36 304 42 259 78 259 S 120 343 157 304 199 265 235 304 277 337 314 304 356 272 392 304 434 333 471 304 513 276 549 304 591 329 628 304 670 281 706 304 748 325 785 304 827 285 863 304 905 322 942 304 984 288 1020 304 1062 319 1099 304 1141 291 1200 304"
    fill="none"
    stroke="url(#signal)"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.56"
  />

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="72" fill="#7dd3fc" font-size="16" font-weight="700" letter-spacing="3">
      COMMUNICATIONS ENGINEERING · INTERACTIVE SYSTEMS
    </text>
    <text x="68" y="151" fill="#f8fafc" font-size="62" font-weight="750" letter-spacing="-1.5">
      Timmy Pan
    </text>
    <text x="72" y="194" fill="#cbd5e1" font-size="23" font-weight="450">
      Mathematics → models → reproducible code
    </text>

    <g transform="translate(72 226)">
      <rect width="104" height="36" rx="18" fill="#0f3348" stroke="#38bdf8" stroke-opacity="0.45" />
      <text x="52" y="23" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="650">5G NR</text>
    </g>
    <g transform="translate(188 226)">
      <rect width="100" height="36" rx="18" fill="#0f3348" stroke="#38bdf8" stroke-opacity="0.45" />
      <text x="50" y="23" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="650">DSP</text>
    </g>
    <g transform="translate(300 226)">
      <rect width="172" height="36" rx="18" fill="#0f3348" stroke="#38bdf8" stroke-opacity="0.45" />
      <text x="86" y="23" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="650">CHANNEL CODING</text>
    </g>
    <g transform="translate(484 226)">
      <rect width="150" height="36" rx="18" fill="#0f3348" stroke="#38bdf8" stroke-opacity="0.45" />
      <text x="75" y="23" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="650">VISUAL TOOLS</text>
    </g>
  </g>

  <g transform="translate(970 164)">
    <circle r="112" fill="#071827" fill-opacity="0.55" stroke="#7dd3fc" stroke-opacity="0.2" />
    <circle r="78" fill="none" stroke="#7dd3fc" stroke-opacity="0.12" stroke-dasharray="4 8" />
    <path d="M -92 0 H 92 M 0 -92 V 92" stroke="#94a3b8" stroke-opacity="0.28" />
    <path d="M -65 -65 L 65 65 M 65 -65 L -65 65" stroke="#94a3b8" stroke-opacity="0.12" />
    <g fill="#38bdf8" filter="url(#glow)">
      <circle cx="-54" cy="-54" r="5" />
      <circle cx="54" cy="-54" r="5" />
      <circle cx="-54" cy="54" r="5" />
      <circle cx="54" cy="54" r="5" />
    </g>
    <g fill="#2dd4bf" opacity="0.88">
      <circle cx="-20" cy="-20" r="3.5" />
      <circle cx="20" cy="-20" r="3.5" />
      <circle cx="-20" cy="20" r="3.5" />
      <circle cx="20" cy="20" r="3.5" />
    </g>
    <text
      x="0"
      y="140"
      text-anchor="middle"
      fill="#7dd3fc"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="12"
      font-weight="650"
      letter-spacing="2"
    >SIGNAL · CODE · VERIFY</text>
  </g>
</svg>
